<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漢字パズル｜まなびやつばめ</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #fff7c2 0%, #b8f7ff 45%, #ffd6ef 100%);
      color: #333;
      overflow-x: hidden;
    }

    .screen {
      min-height: 100vh;
      width: min(1040px, 96vw);
      margin: 0 auto;
      padding: 14px 0 20px;
      text-align: center;
    }

    .hidden { display: none !important; }
    .invisible { opacity: 0; pointer-events: none; }

    .start-card,
    .game-card,
    .result-card {
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid #fff;
      border-radius: 28px;
      padding: 16px 16px;
      box-shadow: 0 12px 0 rgba(255, 183, 77, 0.35), 0 18px 35px rgba(0, 0, 0, 0.12);
    }

    .start-card {
      margin-top: 32px;
      min-height: 74vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .logo-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border-radius: 28px;
      padding: 18px;
      border: 4px solid #87ddff;
      box-shadow: 0 10px 0 rgba(25, 118, 210, 0.18);
      transition: transform .18s ease;
    }

    .logo-link:hover { transform: translateY(-4px); }

    .logo-link img {
      max-width: min(320px, 74vw);
      max-height: 160px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4.2vw, 42px);
      color: #ff7a00;
      letter-spacing: 0.06em;
      text-shadow: 2px 2px 0 #fff1a8;
    }

    .start-title {
      font-size: clamp(34px, 7vw, 64px);
      color: #7b3fe4;
      text-shadow: 3px 3px 0 #fff1a8;
    }

    .lead {
      margin: 6px 0 0;
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 800;
      line-height: 1.7;
    }

    .mode-select {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 16px;
      width: min(520px, 92%);
      margin-top: 10px;
    }

    .mode-btn {
      border: none;
      border-radius: 24px;
      padding: 22px 14px;
      font-family: inherit;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 8px 0 rgba(0,0,0,.18);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .mode-btn:active { transform: translateY(5px); box-shadow: none; }
    .mode-btn strong { display: block; font-size: 28px; margin-bottom: 8px; }
    .mode-btn span { display: block; font-size: 15px; line-height: 1.5; }
    .mode-4 { background: linear-gradient(180deg, #ffb74d, #ff7a00); }
    .mode-9 { background: linear-gradient(180deg, #8bd3ff, #1976d2); }

    .badge-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 3px solid #87ddff;
      font-weight: 900;
      color: #1976d2;
    }

    .game-card { margin-top: 20px; }

    .top-info {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      margin: 12px 0 12px;
    }

    .info-pill {
      font-size: clamp(13px, 1.8vw, 16px);
      font-weight: 900;
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      border: 3px solid #ffd54f;
      box-shadow: 0 4px 0 rgba(255, 193, 7, 0.26);
    }

    .question-text {
      color: #7b3fe4;
      border-color: #c4a8ff;
      box-shadow: 0 5px 0 rgba(126, 87, 194, 0.2);
    }

    .play-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 14px;
      align-items: start;
    }

    .stage-wrap {
      background: rgba(255, 255, 255, 0.78);
      border-radius: 28px;
      border: 4px solid #fff;
      padding: 12px;
      box-shadow: 0 15px 28px rgba(0, 0, 0, 0.12);
      transition: opacity .12s ease;
    }

    .stage {
      position: relative;
      height: 440px;
      border-radius: 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(255,255,255,.9) 0 6px, transparent 7px),
        radial-gradient(circle at 82% 22%, rgba(255,255,255,.9) 0 8px, transparent 9px),
        radial-gradient(circle at 28% 80%, rgba(255,255,255,.75) 0 10px, transparent 11px),
        linear-gradient(180deg, #e8fbff, #fff6d6);
    }

    .target-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 4px dashed rgba(255, 122, 0, 0.55);
      border-radius: 24px;
      background: rgba(255,255,255,0.35);
      display: grid;
      pointer-events: none;
    }

    .target-frame span { border: 1px dashed rgba(255, 122, 0, 0.25); }

    .piece {
      position: absolute;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.08), 0 16px 22px rgba(0, 0, 0, 0.12);
      transition: left 0.72s ease, top 0.72s ease, transform 0.72s ease, box-shadow 0.72s ease;
    }

    .piece::before {
      content: attr(data-kanji);
      position: absolute;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Yu Gothic", serif;
      font-weight: 900;
      text-align: center;
      color: #222;
    }

    .piece::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 12px;
      box-shadow: inset 0 0 0 4px rgba(255, 221, 87, 0.65);
      pointer-events: none;
    }

    .answer-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(.65);
      width: 310px;
      height: 310px;
      border-radius: 32px;
      background: rgba(255,255,255,.96);
      border: 6px solid #ffb74d;
      box-shadow: 0 18px 0 rgba(255, 122, 0, .22), 0 22px 40px rgba(0,0,0,.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity .18s ease, transform .18s ease;
    }

    .answer-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .answer-label {
      font-size: 22px;
      font-weight: 900;
      color: #ff7a00;
      margin-bottom: 4px;
    }

    .answer-big-kanji {
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Yu Gothic", serif;
      font-size: 190px;
      line-height: 1;
      font-weight: 900;
      color: #222;
    }

    .control-panel {
      background: rgba(255,255,255,.86);
      border: 4px solid #fff;
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 12px 24px rgba(0,0,0,.1);
      position: sticky;
      top: 16px;
    }

    .message {
      min-height: 76px;
      padding: 10px;
      border-radius: 18px;
      background: #ffffff;
      border: 3px solid #f5b7ff;
      color: #b000bd;
      font-weight: 900;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .button-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .main-action-area {
      margin-bottom: 34px;
    }

    .sub-action-area {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 18px;
      border-top: 3px dashed rgba(126, 87, 194, 0.25);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 12px 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      font-family: inherit;
    }

    .btn:active { transform: translateY(4px); box-shadow: none; }

    .btn-main {
      background: linear-gradient(180deg, #ffd54f, #ff7a00);
      color: #fff;
      box-shadow: 0 8px 0 #c95b00;
      font-size: 22px;
      padding: 18px 14px;
      border: 4px solid #fff3b0;
      animation: pulseMainButton 1.6s infinite;
    }

    @keyframes pulseMainButton {
      0% {
        transform: scale(1);
        box-shadow: 0 10px 0 #c95b00, 0 0 0 rgba(255,122,0,0.0);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 10px 0 #c95b00, 0 0 22px rgba(255,122,0,0.45);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 10px 0 #c95b00, 0 0 0 rgba(255,122,0,0.0);
      }
    }

    .btn-next-question {
      background: linear-gradient(180deg, #ffd54f, #ff7a00);
      color: #fff;
      box-shadow: 0 8px 0 #c95b00;
      font-size: 22px;
      padding: 18px 14px;
      border: 4px solid #fff3b0;
      animation: pulseMainButton 1.6s infinite;
    }

    .btn-reset {
      background: linear-gradient(180deg, #a7f3d0, #22c55e);
      color: #07522b;
      box-shadow: 0 7px 0 #14823d;
    }

    .btn-home {
      background: linear-gradient(180deg, #e2e8f0, #94a3b8);
      color: #233044;
      box-shadow: 0 7px 0 #64748b;
    }

    .btn-copy {
      background: linear-gradient(180deg, #fde68a, #f59e0b);
      color: #5b3100;
      box-shadow: 0 7px 0 #b45309;
    }

    .copy-note {
      margin-top: 10px;
      min-height: 24px;
      font-size: 13px;
      font-weight: 900;
      color: #0f766e;
    }

    .confetti {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
      z-index: 25;
    }

    .confetti.show { opacity: 1; }

    .confetti i {
      position: absolute;
      width: 12px;
      height: 20px;
      border-radius: 4px;
      animation: fall 1.2s ease forwards;
    }

    @keyframes fall {
      0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(440px) rotate(480deg); opacity: 0; }
    }

    .result-card {
      margin-top: 56px;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .result-title {
      font-size: clamp(34px, 6vw, 60px);
      color: #ff7a00;
      margin: 0;
    }

    .result-text {
      font-size: clamp(18px, 3vw, 26px);
      font-weight: 900;
      line-height: 1.7;
      margin: 0;
    }

    @media (max-width: 900px) {
      /* タブレット幅やJSFiddleの表示枠でも、ボタンは右側に維持する */
      .play-layout { grid-template-columns: minmax(0, 1fr) 200px; }
      .control-panel { position: sticky; top: 12px; }
      .button-row { display: flex; flex-direction: column; }
      .btn { font-size: 14px; padding: 10px 8px; }
      .btn-main, .btn-next-question { font-size: 19px; padding: 15px 10px; }
    }

    @media (max-width: 640px) {
      /* スマホのように本当に狭い画面だけ、下に回す */
      .play-layout { grid-template-columns: 1fr; }
      .control-panel { position: static; }
    }

    @media (max-width: 760px) {
      .mode-select { grid-template-columns: 1fr; }
      .top-info { grid-template-columns: 1fr; }
      .stage { height: 380px; }
      .answer-overlay { width: 260px; height: 260px; }
      .answer-big-kanji { font-size: 155px; }
      .button-row { grid-template-columns: 1fr; }
    }

    .range-select { width: min(520px, 92%); padding: 14px 16px; background: #f5f0ff; border: 3px solid #d9c7ff; border-radius: 20px; }
    .range-select label { display: block; color: #6434b9; font-size: 18px; font-weight: 900; margin-bottom: 8px; }
    .range-select select { width: 100%; min-height: 48px; border: 2px solid #b69be9; border-radius: 12px; padding: 10px; font-weight: 800; font-family: inherit; font-size: 17px; background: white; color: #333; }
    .range-note { margin: 10px 0 0; font-size: 14px; font-weight: 700; line-height: 1.6; }
    .source-note { font-size: 12px; color: #555; margin: 6px 0; line-height: 1.6; }
    .source-note a { color: #6342a5; }
    .answer-overlay { max-width: calc(100% - 16px); height: auto; aspect-ratio: 1; }
    .game-range { color: #6434b9; font-size: 14px; margin: 10px 0 0; font-weight: 800; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 4px solid #6434b9; outline-offset: 5px; }
    .btn:disabled { cursor: wait; animation: none; filter: saturate(.5); }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>

      "kanji": "胃異遺域宇映延沿恩我灰拡革閣割株干巻看簡危机揮貴疑吸供胸郷勤筋系敬警劇激穴券絹権憲源厳己呼誤后孝皇紅降鋼刻穀骨困砂座済裁策冊蚕至私姿視詞誌磁射捨尺若樹収宗就衆従縦縮熟純処署諸除承将傷障蒸針仁垂推寸盛聖誠舌宣専泉洗染銭善奏窓創装層操蔵臓存尊退宅担探誕段暖値宙忠著庁頂腸潮賃痛敵展討党糖届難乳認納脳派拝背肺俳班晩否批秘俵腹奮並陛閉片補暮宝訪亡忘棒枚幕密盟模訳郵優預幼欲翌乱卵覧裏律臨朗論"
    }
  ]
}
  </script>
  <script>
    const QUESTION_COUNT = 20;

    const kanjiData = JSON.parse(document.getElementById('kanjiData').textContent);
    const gradeSelect = document.getElementById('gradeSelect');
    const rangeNote = document.getElementById('rangeNote');
    const gameRange = document.getElementById('gameRange');
    let selectedGrade = 1;
    let questionVersion = 0;
    let nextQuestionTimer = null;

    function getKanjiPool(maxGrade) {
      return kanjiData.grades.filter(group => group.grade <= maxGrade)
        .flatMap(group => Array.from(group.kanji));
    }

    function updateRangeNote() {
      const grade = Number(gradeSelect.value);
      const pool = getKanjiPool(grade);
      rangeNote.textContent = `${grade === 1 ? '小学1年生' : `小学1〜${grade}年生`}で習う${pool.length.toLocaleString('ja-JP')}字から、ランダムに20問。`;
    }
    gradeSelect.addEventListener('change', updateRangeNote);
    updateRangeNote();

    let kanjiList = [];

    function shuffleArray(array) {
      const copied = [...array];
      for (let i = copied.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    const startScreen = document.getElementById('startScreen');
    const gameScreen = document.getElementById('gameScreen');
    const resultScreen = document.getElementById('resultScreen');
    const restartBtn = document.getElementById('restartBtn');
    const homeBtn = document.getElementById('homeBtn');
    const resultHomeBtn = document.getElementById('resultHomeBtn');

    const stageWrap = document.getElementById('stageWrap');
    const stage = document.getElementById('stage');
    const targetFrame = document.getElementById('targetFrame');
    const nextBtn = document.getElementById('nextBtn');
    const nextQuestionBtn = document.getElementById('nextQuestionBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stepCount = document.getElementById('stepCount');
    const message = document.getElementById('message');
    const confetti = document.getElementById('confetti');
    const questionNumber = document.getElementById('questionNumber');
    const resultText = document.getElementById('resultText');
    const answerOverlay = document.getElementById('answerOverlay');
    const answerBigKanji = document.getElementById('answerBigKanji');
    

    let currentQuestionIndex = 0;
    let currentStep = 0;
    let currentMode = 4;
    let pieces = [];
    let returnOrder = [];
    let isLoadingQuestion = false;

    const messages = {
      start: 'まずは、何の漢字か予想してみよう！',
      middle: '少しずつ形が見えてきたね！まだ答えは内緒です。',
      near: 'あと少し！頭の中で完成させてみよう！',
      complete: '正解が出ました！よく見つけたね！'
    };

    function showScreen(screenName) {
      startScreen.classList.add('hidden');
      gameScreen.classList.add('hidden');
      resultScreen.classList.add('hidden');
      if (screenName === 'start') startScreen.classList.remove('hidden');
      if (screenName === 'game') gameScreen.classList.remove('hidden');
      if (screenName === 'result') resultScreen.classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function getStageSize() {
      const isSmall = window.innerWidth <= 760;
      const full = Math.min(isSmall ? 230 : 250, Math.max(140, stage.clientWidth - 28));
      const grid = currentMode === 4 ? 2 : 3;
      const piece = full / grid;
      return { full, piece };
    }

    function getInitialPosition(index, total, pieceSize) {
      const rect = stage.getBoundingClientRect();
      const stageW = rect.width || 700;
      const stageH = rect.height || 590;
      const margin = stageW < 320 ? 14 : 22;
      const right = Math.max(margin, stageW - pieceSize - margin);
      const bottom = Math.max(margin, stageH - pieceSize - margin);
      const midX = Math.max(margin, (stageW - pieceSize) / 2);
      const midY = Math.max(margin, (stageH - pieceSize) / 2);

      const positions4 = [
        { left: right, top: bottom, rot: 19 },
        { left: margin, top: bottom, rot: -15 },
        { left: right, top: margin, rot: -20 },
        { left: margin, top: margin, rot: 14 }
      ];

      const positions9 = [
        { left: margin, top: margin, rot: -16 },
        { left: midX, top: margin, rot: 13 },
        { left: right, top: margin, rot: -12 },
        { left: margin, top: Math.max(margin, midY - pieceSize * 1.25), rot: 18 },
        { left: right, top: Math.max(margin, midY - pieceSize * 1.25), rot: -18 },
        { left: margin, top: Math.min(bottom, midY + pieceSize * 1.25), rot: -13 },
        { left: right, top: Math.min(bottom, midY + pieceSize * 1.25), rot: 16 },
        { left: midX, top: bottom, rot: -14 },
        { left: Math.max(margin, midX - pieceSize * 1.55), top: bottom, rot: 15 }
      ];

      // 狭い画面でも9枚が重なりすぎないよう、散らした配置を画面幅に合わせる。
      if (total === 9 && stageW < 500) {
        const col = index % 3;
        const row = Math.floor(index / 3);
        return { left: `${margin + col * (right - margin) / 2}px`,
          top: `${margin + row * (bottom - margin) / 2}px`, rot: index % 2 ? 9 : -9 };
      }
      const selected = total === 4 ? positions4[index] : positions9[index];
      return { left: `${selected.left}px`, top: `${selected.top}px`, rot: selected.rot };
    }

    function injectPieceBeforeStyles(full) {
      let styleEl = document.getElementById('dynamicPieceStyle');
      if (!styleEl) {
        styleEl = document.createElement('style');
        styleEl.id = 'dynamicPieceStyle';
        document.head.appendChild(styleEl);
      }
      styleEl.textContent = `
        .piece::before {
          width: ${full}px;
          height: ${full}px;
          left: var(--x);
          top: var(--y);
          font-size: ${Math.round(full * 0.86)}px;
          line-height: ${full}px;
        }
      `;
    }

    function createPieces() {
      document.querySelectorAll('.piece').forEach(el => el.remove());
      pieces = [];
      returnOrder = [];

      const grid = currentMode === 4 ? 2 : 3;
      const total = currentMode;
      const { full, piece } = getStageSize();
      const kanji = kanjiList[currentQuestionIndex];

      targetFrame.style.width = full + 'px';
      targetFrame.style.height = full + 'px';
      targetFrame.style.gridTemplateColumns = `repeat(${grid}, 1fr)`;
      targetFrame.style.gridTemplateRows = `repeat(${grid}, 1fr)`;
      targetFrame.innerHTML = '';
      for (let i = 0; i < total; i++) targetFrame.appendChild(document.createElement('span'));

      injectPieceBeforeStyles(full);

      for (let i = 0; i < total; i++) {
        const row = Math.floor(i / grid);
        const col = i % grid;
        const pos = getInitialPosition(i, total, piece);

        const pieceEl = document.createElement('div');
        pieceEl.className = 'piece';
        pieceEl.dataset.index = i;
        pieceEl.dataset.kanji = kanji;
        pieceEl.style.width = piece + 'px';
        pieceEl.style.height = piece + 'px';
        pieceEl.style.left = pos.left;
        pieceEl.style.top = pos.top;
        pieceEl.style.transform = `rotate(${pos.rot}deg)`;
        pieceEl.style.setProperty('--x', (-col * piece) + 'px');
        pieceEl.style.setProperty('--y', (-row * piece) + 'px');

        stage.appendChild(pieceEl);
        pieces.push(pieceEl);
      }

      returnOrder = shuffleArray(pieces);
    }

    function placePieceAtAnswer(pieceEl) {
      const grid = currentMode === 4 ? 2 : 3;
      const { full, piece } = getStageSize();
      const index = Number(pieceEl.dataset.index);
      const row = Math.floor(index / grid);
      const col = index % grid;
      pieceEl.style.left = `calc(50% - ${full / 2}px + ${col * piece}px)`;
      pieceEl.style.top = `calc(50% - ${full / 2}px + ${row * piece}px)`;
      pieceEl.style.transform = 'rotate(0deg)';
      pieceEl.classList.add('fixed');
    }

    function updateView() {
      const totalQuestions = kanjiList.length;
      questionNumber.textContent = `第${currentQuestionIndex + 1}問 / ${totalQuestions}問｜${currentMode}分割`;
      stepCount.textContent = `もどったパーツ：${currentStep} / ${currentMode}`;

      if (currentStep === 0) message.textContent = messages.start;
      else if (currentStep < currentMode - 1) message.textContent = messages.middle;
      else if (currentStep < currentMode) message.textContent = messages.near;
      else message.textContent = messages.complete;

      if (currentStep >= currentMode) {
        // 重要：正解漢字は、完成した瞬間までDOM上に入れない。
        // これで次問の答えが残像のように見える現象を防ぐ。
        answerBigKanji.textContent = kanjiList[currentQuestionIndex];
        answerOverlay.classList.add('show');
        nextBtn.classList.add('hidden');
        nextQuestionBtn.classList.remove('hidden');
        nextQuestionBtn.textContent = currentQuestionIndex === totalQuestions - 1 ? '結果を見る' : '次の問題へ';
        launchConfetti();
      } else {
        answerOverlay.classList.remove('show');
        answerBigKanji.textContent = '';
        nextBtn.classList.remove('hidden');
        nextQuestionBtn.classList.add('hidden');
        confetti.classList.remove('show');
      }
    }

    function startGame(mode) {
      cancelPendingQuestion();
      currentMode = mode;
      selectedGrade = Number(gradeSelect.value);
      currentQuestionIndex = 0;
      const pool = getKanjiPool(selectedGrade);
      kanjiList = shuffleArray(pool).slice(0, QUESTION_COUNT);
      gameRange.textContent = `小学${selectedGrade}年生まで｜出題対象 ${pool.length.toLocaleString('ja-JP')}字`;
      showScreen('game');
      loadQuestionSafely();
    }

    function loadQuestionSafely() {
      if (isLoadingQuestion) return;
      isLoadingQuestion = true;
      const version = ++questionVersion;

      // 残像対策：まず前問の正解レイヤーを完全に空にする。
      // 「非表示にする」だけだと、描画タイミングで一瞬見える場合があるため。
      answerOverlay.classList.remove('show');
      answerBigKanji.textContent = '';
      confetti.classList.remove('show');
      confetti.innerHTML = '';
      stageWrap.classList.add('invisible');

      // 既存パーツも先に消して、前問の漢字が残らないようにする。
      document.querySelectorAll('.piece').forEach(el => el.remove());
      targetFrame.innerHTML = '';

      requestAnimationFrame(() => {
        if (version !== questionVersion) return;
        currentStep = 0;

        createPieces();
        updateView();

        // 正解文字はここではセットしない。
        // 最後のパーツが揃った瞬間だけ updateView() 内で表示する。
        answerBigKanji.textContent = '';

        requestAnimationFrame(() => {
          if (version !== questionVersion) return;
          stageWrap.classList.remove('invisible');
          isLoadingQuestion = false;
        });
      });
    }

    function moveNextPiece() {
      if (currentStep >= currentMode || isLoadingQuestion) return;
      playMoveSound();
      placePieceAtAnswer(returnOrder[currentStep]);
      currentStep++;
      updateView();
    }

    function playMoveSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.setValueAtTime(660, now);
        osc1.frequency.exponentialRampToValueAtTime(990, now + 0.11);
        osc2.frequency.setValueAtTime(1320, now + 0.02);
        osc2.frequency.exponentialRampToValueAtTime(1760, now + 0.13);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);
        osc1.start(now);
        osc2.start(now + 0.02);
        osc1.stop(now + 0.18);
        osc2.stop(now + 0.18);
        setTimeout(() => ctx.close(), 240);
      } catch (e) {}
    }

    function goNextQuestion() {
      if (isLoadingQuestion || currentStep < currentMode) return;
      isLoadingQuestion = true;
      const version = ++questionVersion;

      // 次問へ進む瞬間に、正解文字そのものを空にする。
      // レイヤーを消すだけではなく、文字データも消すのが重要。
      answerOverlay.classList.remove('show');
      answerBigKanji.textContent = '';
      confetti.classList.remove('show');
      confetti.innerHTML = '';
      stageWrap.classList.add('invisible');

      document.querySelectorAll('.piece').forEach(el => el.remove());
      targetFrame.innerHTML = '';

      nextQuestionTimer = setTimeout(() => {
        if (version !== questionVersion) return;
        nextQuestionTimer = null;
        if (currentQuestionIndex >= kanjiList.length - 1) {
          resultText.textContent = `小学${selectedGrade}年生まで・${currentMode}分割の${kanjiList.length}問すべて終わりました。漢字の形をよく見られましたね！`;
          showScreen('result');
          stageWrap.classList.remove('invisible');
          isLoadingQuestion = false;
          return;
        }

        currentQuestionIndex++;
        isLoadingQuestion = false;
        loadQuestionSafely();
      }, 120);
    }

    function resetCurrentQuestion() {
      if (isLoadingQuestion) return;
      loadQuestionSafely();
    }

    function launchConfetti() {
      confetti.innerHTML = '';
      const colors = ['#ff5c8a', '#ffd54f', '#4dd0e1', '#81c784', '#9575cd', '#ff8a65'];
      for (let i = 0; i < 34; i++) {
        const item = document.createElement('i');
        item.style.left = Math.random() * 100 + '%';
        item.style.top = '-30px';
        item.style.background = colors[Math.floor(Math.random() * colors.length)];
        item.style.animationDelay = Math.random() * 0.45 + 's';
        item.style.animationDuration = 0.9 + Math.random() * 0.8 + 's';
        confetti.appendChild(item);
      }
      confetti.classList.add('show');
    }

    function cancelPendingQuestion() {
      questionVersion++;
      clearTimeout(nextQuestionTimer);
      nextQuestionTimer = null;
      isLoadingQuestion = false;
    }

    function returnToStart() {
      cancelPendingQuestion();
      answerOverlay.classList.remove('show');
      answerBigKanji.textContent = '';
      confetti.classList.remove('show');
      showScreen('start');
    }

    restartBtn.addEventListener('click', () => startGame(currentMode));
    homeBtn.addEventListener('click', returnToStart);
    resultHomeBtn.addEventListener('click', returnToStart);
    nextBtn.addEventListener('click', moveNextPiece);
    nextQuestionBtn.addEventListener('click', goNextQuestion);
    resetBtn.addEventListener('click', resetCurrentQuestion);

    window.addEventListener('resize', () => {
      if (gameScreen.classList.contains('hidden') || !kanjiList.length || isLoadingQuestion) return;
      const step = currentStep;
      const fixed = new Set(returnOrder.slice(0, step).map(piece => Number(piece.dataset.index)));
      createPieces();
      pieces.forEach(piece => { if (fixed.has(Number(piece.dataset.index))) placePieceAtAnswer(piece); });
      returnOrder = [...pieces.filter(piece => fixed.has(Number(piece.dataset.index))),
        ...shuffleArray(pieces.filter(piece => !fixed.has(Number(piece.dataset.index))))];
    });
  </script>
</body>
